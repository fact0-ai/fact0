openapi: 3.1.0
info:
  title: Fact0 Execution Telemetry API
  version: 1.0.0
  description: |
    Execution tracing API for AI agent observability - executions, spans, events, DAG, and replay.

    API-key write authentication is required for ingestion; reads accept a scoped API key or dashboard JWT.
    Encoded request bodies have a 4 MiB limit (413 when exceeded).
    Parent/causal/event span references must belong to the same execution.
    RUNNING spans may complete once; lifecycle snapshots remain append-only.
    Replay reconstructs recorded frames in timestamp order, with ingestion sequence as
    a tie breaker. It does not re-execute tools or models.
servers:
  - url: http://localhost:3000
    description: Self-hosted web and API origin
security:
  - apiKey: []
tags:
  - name: Ingest
  - name: Query
  - name: Replay
paths:
  /api/v1/executions:
    post:
      tags: [Ingest]
      summary: Start a new execution trace
      operationId: startExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExecutionRequest"
      responses:
        "413":
          description: Encoded request exceeds 4 MiB.
        "201":
          description: Execution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Query]
      summary: List executions
      operationId: listExecutions
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [RUNNING, COMPLETED, FAILED, CANCELLED]
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionListResponse"
  /api/v1/executions/{executionID}/spans:
    post:
      tags: [Ingest]
      summary: Ingest spans for an execution
      description: Send RUNNING parents before their children. Completion retains identity/start time and updates terminal status, end time, and content atomically with immutable lifecycle events. Completed content cannot be overwritten.
      operationId: ingestSpans
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spans]
              properties:
                spans:
                  type: array
                  items:
                    $ref: "#/components/schemas/Span"
      responses:
        "200":
          description: Batch processed; inspect accepted_count and per-item errors even on HTTP 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
    get:
      tags: [Query]
      summary: List spans for an execution
      operationId: getSpans
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      responses:
        "200":
          description: Span list
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Span"
  /api/v1/executions/{executionID}/events:
    post:
      tags: [Ingest]
      summary: Ingest execution events
      operationId: ingestEvents
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: "#/components/schemas/ExecutionEvent"
      responses:
        "200":
          description: Batch processed; inspect accepted_count and per-item errors even on HTTP 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/v1/executions/{executionID}/end:
    put:
      tags: [Ingest]
      summary: End an execution
      description: Terminal status must be COMPLETED, FAILED, or CANCELLED. Repeating the same completion preserves its first end timestamp.
      operationId: endExecution
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [COMPLETED, FAILED, CANCELLED]
                ended_at:
                  type: string
                  format: date-time
                  description: Optional captured end time, at or after started_at. Defaults to server time. Stored at microsecond precision; explicit retries must use the same time.
      responses:
        "200":
          description: Execution ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
  /api/v1/executions/{executionID}:
    get:
      tags: [Query]
      summary: Get execution detail
      operationId: getExecution
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      responses:
        "200":
          description: Execution detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/executions/{executionID}/dag:
    get:
      tags: [Query]
      summary: Get execution DAG
      operationId: getDAG
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
      responses:
        "200":
          description: DAG nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DAGResponse"
  /api/v1/executions/{executionID}/replay:
    get:
      tags: [Replay]
      summary: Replay execution frames
      operationId: replayExecution
      parameters:
        - $ref: "#/components/parameters/ExecutionID"
        - name: from_sequence
          in: query
          schema:
            type: integer
            format: int64
        - name: to_sequence
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Replay frames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResponse"
  /api/v1/spans/{spanID}:
    get:
      tags: [Query]
      summary: Get span detail with events
      operationId: getSpan
      parameters:
        - name: spanID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Span and events
          content:
            application/json:
              schema:
                type: object
                properties:
                  span:
                    $ref: "#/components/schemas/Span"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionEvent"
  /api/v1/spans/{spanID}/events:
    get:
      tags: [Query]
      summary: Get events for a span
      operationId: getSpanEvents
      parameters:
        - name: spanID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Span events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionEvent"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  parameters:
    ExecutionID:
      name: executionID
      in: path
      required: true
      schema:
        type: string
  schemas:
    StartExecutionRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
        agent_name:
          type: string
        trigger:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          description: Retries with the same tenant, agent, and key return the stored execution.
        started_at:
          type: string
          format: date-time
          description: Optional captured start time for offline delivery. Defaults to server time. Stored at microsecond precision; explicit retries must use the same time.
    Execution:
      type: object
      properties:
        id:
          type: string
        agent_id:
          type: string
        agent_name:
          type: string
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, CANCELLED]
        root_span_id:
          type: string
        trigger:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    Span:
      type: object
      description: Supply explicit IDs when separate work has identical names, kind, parent, and microsecond start time.
      required: [name, span_type, started_at]
      properties:
        id:
          type: string
        execution_id:
          type: string
        parent_span_id:
          type: string
        caused_by_span_ids:
          type: array
          items:
            type: string
        span_type:
          type: string
          enum:
            - TOOL_CALL
            - MODEL_INVOCATION
            - STATE_MUTATION
            - HUMAN_APPROVAL
            - POLICY_EVALUATION
            - CUSTOM
        name:
          type: string
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, CANCELLED]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    ExecutionEvent:
      type: object
      properties:
        id:
          type: string
        execution_id:
          type: string
        span_id:
          type: string
        sequence_number:
          type: integer
          format: int64
        event_type:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    IngestResponse:
      type: object
      properties:
        accepted_count:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/IngestError"
    IngestError:
      type: object
      properties:
        entity_id:
          type: string
        code:
          type: string
        message:
          type: string
    ExecutionListResponse:
      type: object
      properties:
        executions:
          type: array
          items:
            $ref: "#/components/schemas/Execution"
        total:
          type: integer
    DAGResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            additionalProperties: true
    ReplayResponse:
      type: object
      properties:
        execution:
          $ref: "#/components/schemas/Execution"
        duration_ms:
          type: integer
          description: Maximum of recorded execution duration and latest replay elapsed time.
        total_frames:
          type: integer
        frames:
          type: array
          items:
            type: object
            additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: string
                message:
                  type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
